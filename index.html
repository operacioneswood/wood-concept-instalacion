<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wood Concept · Instalación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ══════════════ NAVIGATION ══════════════ -->
  <nav class="app-nav">
    <div class="nav-brand">
      <span class="brand-monogram">WC</span>
      <span class="brand-name">Wood Concept</span>
      <span class="brand-sep">·</span>
      <span class="brand-sub">Instalación</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn active" data-tab="instalacion">Instalación</button>
      <button class="nav-btn" data-tab="cronograma">Cronograma Fábrica</button>
    </div>
    <div class="nav-right">
      <span id="sync-status" class="sync-status"></span>
      <button class="btn-icon" id="btn-refresh" title="Forzar sincronización">↻</button>
      <button class="btn-icon" id="btn-tablet-toggle" title="Cambiar a modo tablet">📱</button>
      <button class="btn-icon" id="btn-settings" title="Configuración">⚙</button>
    </div>
  </nav>

  <div class="app-body">
    <div id="tab-instalacion" class="tab-screen tab-active">
      <div id="instalacion-container"></div>
    </div>
    <div id="tab-cronograma" class="tab-screen">
      <div id="cronograma-container"></div>
    </div>
  </div>

  <!-- ══════════════ SETTINGS MODAL ══════════════ -->
  <div id="settings-overlay" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-hdr">
        <span class="modal-title">⚙ Configuración</span>
        <button class="modal-close" id="btn-settings-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <div class="settings-title">Conexión ClickUp</div>
          <label class="field-label">API Token</label>
          <input type="password" id="cfg-api-key" class="field-input" placeholder="pk_xxxxxxxxxxxxxxxx" autocomplete="off">
          <label class="field-label">ID de lista o carpeta</label>
          <input type="text" id="cfg-list-id" class="field-input" placeholder="90090072307">
          <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
            <button class="btn-primary" id="cfg-sync-btn">↻ Sincronizar ahora</button>
            <span id="cfg-sync-status" class="cfg-sync-status"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Scripts — order matters -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/clickup.js"></script>
  <script src="js/instalacion.js"></script>
  <script src="js/cronograma.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
